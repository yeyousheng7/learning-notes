{% import "partials/tabs-item.html" as item with context %}
<nav class="md-tabs" aria-label="{{ lang.t('tabs') }}" data-md-component="tabs">
  <div class="md-grid">
    <ul class="md-tabs__list">
      {% for nav_item in nav.items %}
        {% if nav_item.is_page and nav_item.file.src_uri == "sparks/index.md" %}
          <li class="md-tabs__item md-tabs__item--sparks{% if nav_item.active %} md-tabs__item--active{% endif %}">
            <a href="{{ nav_item.url | url }}" class="md-tabs__link"{% if nav_item.active %} aria-current="page"{% endif %}>
              {{ nav_item.title }}
            </a>
          </li>
        {% else %}
          {{ item.render(nav_item) }}
        {% endif %}
      {% endfor %}
    </ul>
  </div>
</nav>
