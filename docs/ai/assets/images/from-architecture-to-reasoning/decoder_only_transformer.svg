<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="536" viewBox="0 0 1020 536" role="img" aria-labelledby="title desc">
  <title id="title">Decoder-only Transformer 结构示意图</title>
  <desc id="desc">Decoder-only Transformer 由多层 Decoder Block 堆叠构成，不包含独立的 Encoder。</desc>
  <rect width="1020" height="536" fill="#fcfcfc"/>
  <g font-family="Noto Sans CJK SC, sans-serif" fill="#111111">
    <text x="510" y="45" text-anchor="middle" font-size="26" font-weight="700">Decoder-only Transformer</text>
    <text x="510" y="81" text-anchor="middle" font-size="19" fill="#555555">仅由 Decoder Block 堆叠构成</text>

    <rect x="190" y="115" width="636" height="318" rx="16" fill="#eff4ff" stroke="#91b5ff" stroke-width="1.15"/>
    <text x="508" y="160" text-anchor="middle" font-size="25" font-weight="700">Decoder</text>

    <g fill="#f7f7f8" stroke="#d8dbe1" stroke-width="1">
      <rect x="208" y="186" width="601" height="69" rx="12"/>
      <rect x="208" y="268" width="601" height="68" rx="12"/>
      <rect x="208" y="347" width="601" height="71" rx="12"/>
    </g>
    <g font-size="24" text-anchor="middle">
      <text x="508.5" y="228">Decoder Block 3</text>
      <text x="508.5" y="310">Decoder Block 2</text>
      <text x="508.5" y="390">Decoder Block 1</text>
    </g>

    <text x="10" y="482" font-size="19" fill="#515151">
      <tspan x="10">注：GPT 一类 Decoder-only Transformer 仅堆叠 Decoder Block。</tspan>
    </text>
  </g>
</svg>
