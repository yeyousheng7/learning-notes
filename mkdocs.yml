site_name: 笔迹
site_description: 记录、整理、足迹。
site_author: yeyousheng7

hooks:
  - hooks/site_assets.py

watch:
  - assets

theme:
  name: material
  language: zh
  logo: assets/logo.svg
  favicon: assets/favicon.svg

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: 深色模式

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: 浅色模式

nav:
  - 首页: index.md
  - AI 对话学习笔记:
      - Java:
          - JVM:
              - 运行时内存、GC 与类加载: ai-generated/java/jvm/runtime-memory-gc-class-loading.md
          - Spring Cloud:
              - 微服务调用链与治理: ai-generated/java/spring-cloud/microservice-call-chain-governance.md
      - 数据库:
          - MySQL:
              - 事务、MVCC 与锁: ai-generated/database/mysql/transactions-mvcc-locking.md
              - EXPLAIN 与索引设计: ai-generated/database/mysql/explain-index-design.md
              - EXPLAIN 实操复盘: ai-generated/database/mysql/explain-practice.md
  - LLM 学习笔记:
      - 从 Token 到 Transformer: ai/from-token-to-transformer.md
      - 从模型架构到训练与推理: ai/from-architecture-to-reasoning.md
  - 科普向:
      - 代理: popular-science/proxy.md
  - AI 提示词库: ai/prompts.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

copyright: Copyright &copy; 2026 · 持续学习，持续记录
